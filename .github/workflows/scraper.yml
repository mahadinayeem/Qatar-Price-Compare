name: Daily Price Scraper

on:
  # ── Scheduled run: every day at 20:00 UTC = 2:00 AM BD Time / 11:00 PM Qatar Time ──
  schedule:
    - cron: "0 20 * * *"

  # ── Manual trigger from GitHub UI ──
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    name: Scrape & Export
    runs-on: ubuntu-22.04
    timeout-minutes: 60          # safety: kill if hung

    env:
      DATABASE_PATH: ../frontend/data/products.db
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_DRIVE_FOLDER_ID: "1-CTfEXTkOY-YzfHxMt_uO2Ij6VnNIbbO"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      # 3. Install Python dependencies
      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements.txt

      # 4. Install Playwright browsers (Chromium only)
      #    Use python -m playwright to avoid PATH issues in CI
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # 5. Check env vars are set (debug)
      - name: Verify secrets are available
        run: |
          if [ -z "$GOOGLE_CREDENTIALS" ]; then
            echo "WARNING: GOOGLE_CREDENTIALS is EMPTY"
          else
            echo "OK: GOOGLE_CREDENTIALS is set (length: ${#GOOGLE_CREDENTIALS})"
          fi
          if [ -z "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            echo "WARNING: GOOGLE_DRIVE_FOLDER_ID is EMPTY"
          else
            echo "OK: GOOGLE_DRIVE_FOLDER_ID is set: $GOOGLE_DRIVE_FOLDER_ID"
          fi

      # 6. Run scraper (saves to SQLite) + export CSV + upload to Drive
      - name: Run scraper & export
        working-directory: scraper
        run: python main.py

      # 7. Commit & push updated DB + master CSV back to repo
      - name: Commit updated database and master CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/products.db
          if [ -d data/daily ]; then git add data/daily/; fi
          if [ -f data/master_prices.csv ]; then git add data/master_prices.csv; fi

          # Only commit and push if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily scrape $(date -u +'%Y-%m-%d')"
            git checkout -- .
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
