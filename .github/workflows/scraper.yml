name: Daily Price Scraper

on:
  # ── Scheduled run: every day at 18:00 UTC = midnight Qatar time (UTC+6) ──
  schedule:
    - cron: "0 18 * * *"

  # ── Manual trigger from GitHub UI ──
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape & Export
    runs-on: ubuntu-latest
    timeout-minutes: 60          # safety: kill if hung

    env:
      DATABASE_PATH: frontend/data/products.db
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_DRIVE_FOLDER_ID: "1-CTfEXTkOY-YzfHxMt_uO2Ij6VnNIbbO"

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      # 3. Install Python dependencies
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # 4. Install Playwright browsers (Chromium only)
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      # 5. Run scraper (saves to SQLite) + export CSV + upload to Drive
      - name: Run scraper & export
        run: python scraper/main.py

      # 6. Commit & push updated SQLite DB back to repo (so Vercel can read it)
      - name: Commit updated database
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/data/products.db data/
          git diff --cached --quiet || git commit -m "chore: daily scrape $(date -u +'%Y-%m-%d')"
          git push
